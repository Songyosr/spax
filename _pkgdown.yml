reference:
  - title: "Package Overview and Compatibility"
    desc: "Choose a workflow, preserve input meaning and reuse saved results safely"
    contents:
      - spax-package

  - title: "Public FCA Accessibility"
    desc: "Raster accessibility surfaces with model-specific normalization and independent supply indicators"
    contents:
      - spax_2sfca
      - spax_e2sfca
      - spax_m2sfca
      - spax_3sfca
      - spax_huff2sfca
      - compute_access

  - title: "Access Interface (experimental)"
    desc: "Specify a floating catchment area index without data: its decay (distance weights with a sigma, a step or an inverse decay), its normalization and its selection. spax() computes it on data from prep_data(): raster data give the spax object of the one-call functions, numeric data the index at each origin"
    contents:
      - spec_e2sfca
      - decay_step
      - spax_access_values-methods

  - title: "Allocation Interface (experimental)"
    desc: "Prepare data, specify an allocation model without data (decay kernels, fitted or held parameters), declare observed counts, run the model and work with its result"
    contents:
      - prep_data
      - decay_gaussian
      - spec_clm
      - obs_flows
      - spax
      - spax_huff
      - spax_allocation-methods

  - title: "Allocation Steps (experimental)"
    desc: "The step functions under spax(), for full control: prepare inputs, declare the model, fit, evaluate, predict, check, compare and bootstrap. Prediction, check, compare and bootstrap also accept a result of spax()"
    contents:
      - prepare_allocation
      - clm_allocation
      - huff_allocation
      - fit_allocation
      - evaluate_allocation
      - predict_allocation
      - check_fit
      - compare_fits
      - bootstrap_fit
      - allocation-fit-methods
      - allocation-result-tables
      - allocation-bootstrap-methods
      - print.summary.ae_multistart_fit
      - plot.ae_multistart_fit

  - title: "Distance & Decay Functions"
    desc: "Functions for handling distance relationships"
    contents:
      - calc_decay
      - decay_kernel
      - calc_choice
      - calc_normalize
      - calc_travel_time
      - calc_demand

  - title: "Data Processing Functions"
    desc: "Functions for processing spatial data"
    contents:
      - spread_weighted
      - spread_access
      - gather_weighted
      - gather_demand
      - rasterize_demand
      - transform_pmf
      - transform_demand

  - title: "Simulation & Sampling"
    desc: "Spatial probability and demand sampling helpers; distinct from allocation bootstrap intervals"
    contents:
      - sample_pmf
      - update_pmf
      - transform_likelihood

  - title: "FCA Object Methods"
    desc: "Print, summary, and plot methods for public FCA spax objects"
    contents:
      - print.spax
      - summary.spax
      - print.summary.spax
      - plot.spax

  - title: "Utility Functions"
    desc: "Helper functions and data access"
    contents:
      - read_spax_example
      - read_spax
      - save_spax

  - title: "Cornwall GP Example Data"
    desc: "Open data for NHS Cornwall and Isles of Scilly GP practices; see inst/COPYRIGHTS for sources and licences"
    contents:
      - cornwall_gp
      - cornwall_lsoa
      - cornwall_flows
      - cornwall_travel
      - cornwall_pop
      - cornwall_gp_travel
