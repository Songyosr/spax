url: https://songyosr.github.io/spax/
template:
  bootstrap: 5

articles:
  - title: Data
    navbar: Data
    contents:
      - cornwall-data
      - data-prep
  - title: Accessibility indices
    navbar: Accessibility indices
    contents:
      - fca-methods
      - e2sfca-steps
      - grid-resolution
  - title: Allocation model
    navbar: Allocation model
    contents:
      - model-choice
      - allocation-workflow
      - scenario
